# Docling Serve WebUI —— 一体编排（WebUI + Docling Serve）
#
# 启动：  docker compose up -d
# 访问：  WebUI       http://localhost:8001
#         Docling UI  http://localhost:5001/ui
#
# 说明：
#  - 两个服务在同一 compose 网络，WebUI 通过服务名 http://docling-serve:5001 连接 OCR 引擎
#  - 想用 GPU 加速 OCR：把 docling-serve 的 image 换成
#    quay.io/docling-project/docling-serve-cu128（需宿主机装 nvidia-container-toolkit），
#    并在 docling-serve 服务下加 GPU 预留（见文末注释）
#  - LLM 配置可写进同目录 .env 文件，或直接在 environment 里改
#  - webui 默认拉取已构建好的镜像 helwod/docling-webui；若想本地从源码构建，
#    把 docling-webui 服务的 `image` 换成注释中的 `build: .` 即可。
#    （注意：helwod/docling-webui 须包含最新代码修复，否则请先重新 build 并 push。）

version: '3'

services:
  docling-serve:
    image: quay.io/docling-project/docling-serve
    container_name: docling-serve
    restart: unless-stopped
    ports:
      - "5001:5001"
    environment:
      - DOCLING_SERVE_ENABLE_UI=1
      - GRADIO_MCP_SERVER=True
    volumes:
      - docling-models:/root/.cache/huggingface   # 模型权重缓存，避免每次重建重新下载
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:5001/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 60s
    networks:
      - docling-net

  docling-webui:
    # 默认从本地源码构建，确保包含最新功能（提示词/回复记录、三栏定位、LLM 会话等）。
    # 如需改用预构建镜像，把下面两行互换即可，但必须保证该镜像已包含最新代码修复，
    # 否则「汇总表调用记录」等功能不会生效（这也是之前「提示词/回复没记录」的根因）。
    build: .
    # image: helwod/docling-webui
    container_name: docling-webui
    restart: unless-stopped
    ports:
      - "8001:8001"
    environment:
      # 指向 compose 内部的 Docling 服务（同一网络，无需改）
      - DOCLING_BASE_URL=http://docling-serve:5001
      # LLM（可选，按需填写；或写入同目录 .env 由 compose 自动读取）
      - LLM_API_KEY=${LLM_API_KEY:-your-api-key-here}
      - LLM_BASE_URL=${LLM_BASE_URL:-https://api.openai.com/v1}
      - LLM_MODEL=${LLM_MODEL:-gpt-4o-mini}
    depends_on:
      - docling-serve
    volumes:
      - webui-data:/app/src/data
      - webui-uploads:/app/src/uploads
    networks:
      - docling-net

networks:
  docling-net:
    driver: bridge

volumes:
  docling-models:
  webui-data:
  webui-uploads:
