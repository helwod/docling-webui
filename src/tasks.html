<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>任务列表 - Docling Serve</title>
  <link rel="stylesheet" href="assets/css/style.css" />
</head>
<body>
  <header class="topbar"><div id="nav"></div></header>
  <main class="container">
    <h1 class="page-title">任务列表</h1>
    <p class="page-sub" id="status-line">加载中…</p>

    <div class="card">
      <div class="table-wrap">
        <table class="grid">
          <thead>
            <tr>
              <th style="width:42px"><input type="checkbox" id="select-all" title="全选" /></th>
              <th>状态</th>
              <th>任务名</th>
              <th>文件</th>
              <th>创建</th>
              <th>暂停</th>
              <th>优先级</th>
              <th>LLM</th>
              <th>进度</th>
            </tr>
          </thead>
          <tbody id="task-rows"></tbody>
        </table>
      </div>
      <div id="empty-hint"></div>

      <div class="btn-row" style="margin-top:16px">
        <button class="btn btn-primary" id="process-btn">开始处理</button>
        <button class="btn" id="pause-btn">暂停/恢复</button>
        <button class="btn" id="pin-btn">置顶</button>
        <button class="btn btn-danger" id="delete-btn">删除选中</button>
        <button class="btn" id="export-btn">导出 ZIP（首个勾选）</button>
        <button class="btn" id="refresh-btn">刷新</button>
      </div>
      <div id="msg"></div>
    </div>
  </main>

  <script src="assets/js/common.js"></script>
  <script src="assets/js/api.js"></script>
  <script src="assets/js/tasks.js"></script>
</body>
</html>
